<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กำลังดาวน์โหลดรูปภาพ...</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 50px;
    background-color: transparent;
    font-family: 'Kanit', sans-serif;
  }
  
  .overlay-container {
    background: linear-gradient(135deg, #4b0082, #9932cc);
    border: 3px solid #FFD700;
    border-radius: 20px;
    padding: 10px 30px;
    box-shadow: 0 6px 20px rgba(75, 0, 130, 0.6), inset 0 0 15px rgba(255, 215, 0, 0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    width: fit-content;
  }

  .title {
    font-size: 32px;
    font-weight: 800;
    margin: 0;
    line-height: 1.1;
    color: #ffffff;
  }

  .discount-box {
    background: linear-gradient(135deg, #FFD700, #ffaa00);
    color: #3b0066;
    padding: 2px 20px;
    border-radius: 30px;
    font-size: 38px;
    font-weight: 800;
    margin-top: 8px;
    text-shadow: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<div id="capture" class="overlay-container">
  <div class="title">ซื้อหน้าไลฟ์</div>
  <div class="discount-box">รับส่วนลด 100.-</div>
</div>

<h2 style="font-family: sans-serif; color: #333; margin-top: 50px;">⏳ ระบบกำลังบันทึกภาพแบนเนอร์ให้คุณอัตโนมัติ... <br><br>กรุณาเช็คที่โฟลเดอร์ Download ของคุณครับ!</h2>

<script>
  window.onload = function() {
    // ให้เวลารอโหลดฟอนต์ภาษาไทยสัก 1 วินาที
    setTimeout(() => {
        html2canvas(document.querySelector("#capture"), {
            backgroundColor: null, // ทำให้พื้นหลังโปร่งใส
            scale: 3 // ความละเอียดสูง
        }).then(canvas => {
            let link = document.createElement('a');
            link.download = 'madam_lisa_banner.png'; // โหลดเป็น PNG เพื่อให้พื้นหลังใส
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }, 1500);
  };
</script>
</body>
</html>
