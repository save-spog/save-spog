<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f2f5;
    font-family: 'Kanit', sans-serif;
  }
  .banner {
    position: relative;
    width: 800px;
    height: 400px;
    background-image: url('file:///C:/Users/controlss/.gemini/antigravity/brain/6c5b75a1-b94e-4848-aec4-03c057cfd8b9/live_discount_banner_1778206140352.png');
    background-size: cover;
    background-position: center;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 2;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
  }
  .title {
    font-size: 72px;
    font-weight: 800;
    margin: 0;
    line-height: 1.2;
    color: #FFD700; /* Gold */
  }
  .subtitle {
    font-size: 48px;
    font-weight: 700;
    margin: 15px 0 0 0;
  }
  .highlight {
    background: #ff0055;
    padding: 5px 25px;
    border-radius: 50px;
    display: inline-block;
    box-shadow: 0 4px 15px rgba(255, 0, 85, 0.6);
  }
</style>
</head>
<body>

<div class="banner">
  <div class="overlay"></div>
  <div class="content">
    <p class="title">ซื้อหน้า LIVE</p>
    <p class="subtitle">รับส่วนลด <span class="highlight">100.-</span></p>
  </div>
</div>

</body>
</html>
