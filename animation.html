<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Second Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#ff0055, #00ff99, #00aaff, #ff0055);
            animation: spin 3s linear infinite;
        }

        .circle::before {
            content: '';
            position: absolute;
            inset: 10px;
            background-color: #111;
            border-radius: 50%;
        }

        .text {
            position: relative;
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 1;
            text-align: center;
        }

        .timer {
            font-size: 48px;
            color: #00ff99;
            margin-top: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="circle"></div>
        <div class="text">
            Generating Clip<br>
            <div class="timer" id="timer">10</div>
        </div>
    </div>

    <script>
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');
        const interval = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(interval);
                timerElement.textContent = 'Done!';
            }
        }, 1000);
    </script>
</body>
</html>
